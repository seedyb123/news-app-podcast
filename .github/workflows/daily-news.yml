
name: Daily News Podcast

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-podcast
  cancel-in-progress: false

jobs:
  produce-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Get latest podcast repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Check whether today's episode exists
        id: episode-check
        shell: bash
        run: |
          DATE_CODE=$(TZ=Europe/London date +%d%m%y)
          DAY=$(TZ=Europe/London date +%A | tr '[:upper:]' '[:lower:]')
          EPISODE="${DAY}-${DATE_CODE}-news"
          echo "episode=$EPISODE" >> "$GITHUB_OUTPUT"

          if grep -Fq "news-app-${DAY}-${DATE_CODE}</guid>" feed.xml; then
            echo "Today's episode is already published."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No episode published for today."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.episode-check.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.episode-check.outputs.should_run == 'true'
        run: npm ci

      - name: Install FFmpeg
        if: steps.episode-check.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check required files
        if: steps.episode-check.outputs.should_run == 'true'
        run: |
          test -s editorial-plan.md
          node --check generate-news.mjs
          node --check generate-podcast.mjs
          node --check publish-podcast.mjs

      - name: Generate today's news script
        if: steps.episode-check.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node generate-news.mjs

      - name: Generate ElevenLabs audio
        if: steps.episode-check.outputs.should_run == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          SCRIPT="scripts/${{ steps.episode-check.outputs.episode }}.txt"
          test -s "$SCRIPT"
          node generate-podcast.mjs "$SCRIPT"

      - name: Update podcast RSS and retention
        if: steps.episode-check.outputs.should_run == 'true'
        run: node publish-podcast.mjs

      - name: Publish episode to GitHub Pages
        if: steps.episode-check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- feed.xml '*.mp3'

          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 1
          fi

          git commit -m "Publish ${{ steps.episode-check.outputs.episode }}"
          git push origin HEAD:main

